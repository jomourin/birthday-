<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Gift</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="page">

    <div class="menu-content">

        <h1 class="menu-title">Choose your gift</h1>

        <div class="gifts">

            <!-- MESSAGE -->
            <button class="gift" onclick="goTo('message.html')">
                <div class="gift-picture">

                    <div class="envelope">
                        <div class="envelope-flap"></div>
                        <div class="envelope-heart">♥</div>
                    </div>

                </div>

                <p>MESSAGE</p>
            </button>


            <!-- FLOWERS -->
            <button class="gift" onclick="goTo('flowers.html')">

                <div class="gift-picture">

                    <div class="dozen-bouquet">

                        <!-- 12 ROSES -->
                        <div class="menu-rose r1">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r2">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r3">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r4">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r5">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r6">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r7">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r8">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r9">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r10">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r11">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>

                        <div class="menu-rose r12">
                            <div class="rose-layer layer1"></div>
                            <div class="rose-layer layer2"></div>
                            <div class="rose-layer layer3"></div>
                            <div class="rose-core"></div>
                        </div>


                        <!-- GREEN LEAVES -->
                        <div class="menu-leaf ml1"></div>
                        <div class="menu-leaf ml2"></div>
                        <div class="menu-leaf ml3"></div>
                        <div class="menu-leaf ml4"></div>
                        <div class="menu-leaf ml5"></div>
                        <div class="menu-leaf ml6"></div>
                        <div class="menu-leaf ml7"></div>
                        <div class="menu-leaf ml8"></div>


                        <!-- BLACK WRAPPING -->
                        <div class="menu-wrap"></div>

                        <!-- BLACK RIBBON -->
                        <div class="menu-ribbon"></div>

                    </div>

                </div>

                <p>FLOWERS</p>

            </button>


            <!-- CAKE -->
            <button class="gift" onclick="goTo('cake.html')">

                <div class="gift-picture">

                    <div class="mini-cake">
                        <div class="mini-candle">
                            <span></span>
                        </div>

                        <div class="mini-cake-top"></div>
                        <div class="mini-cake-body"></div>
                    </div>

                </div>

                <p>CAKE</p>

            </button>


            <!-- VIDEO -->
            <button class="gift" onclick="goTo('video.html')">

                <div class="gift-picture">

                    <div class="camera">
                        <div class="camera-top"></div>

                        <div class="camera-lens">
                            <div class="camera-inner"></div>
                        </div>

                        <div class="camera-button"></div>
                    </div>

                </div>

                <p>MEMORIES</p>

            </button>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
