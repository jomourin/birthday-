<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <div class="page">

        <main class="home-content">

            <div class="small-title">
              love, jombot 
            </div>

            <h1>
                Happy Birthday Love!
            </h1>


            <!-- CLICKABLE CAKE -->

            <button
                class="main-cake"
                onclick="goTo('menu.html')"
                aria-label="Open birthday surprise">

                <!-- Candles -->

                <div class="candle candle1">
                    <div class="flame"></div>
                </div>

                <div class="candle candle2">
                    <div class="flame"></div>
                </div>

                <div class="candle candle3">
                    <div class="flame"></div>
                </div>


                <!-- Cake -->

                <div class="cake-top">

                    <div class="cream cream1"></div>

                    <div class="cream cream2"></div>

                    <div class="cream cream3"></div>


                    <div class="cherry cherry1"></div>

                    <div class="cherry cherry2"></div>

                    <div class="cherry cherry3"></div>

                    <div class="cherry cherry4"></div>

                </div>


                <div class="cake-body"></div>

            </button>


            <p class="click-here">
                click the cake to see a surprise!
            </p>

        </main>

    </div>


    <!-- JavaScript -->

    <script src="js/script.js"></script>

</body>

</html>
